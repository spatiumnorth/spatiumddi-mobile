version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Both resolved files. The app's (under /SpatiumDDI) is the one a build
  # uses; the package's is what `swift test --package-path Packages/SpatiumAPI`
  # uses. Covering only the first let the second drift four packages behind.
  - package-ecosystem: swift
    directories:
      - /SpatiumDDI
      - /Packages/SpatiumAPI
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # OpenAPIKit is the generator's parser, not ours: the generator pins it to
    # 6.x (`from: "6.1.0"`). A 7.x pin in the app's resolved file can't be
    # satisfied, so every build silently re-resolves to 6.x and rewrites it.
    # Take OpenAPIKit majors when the generator does, not before.
    ignore:
      - dependency-name: "github.com/mattpolzin/openapikit"
        update-types: ["version-update:semver-major"]
    groups:
      # The generator, its runtime and their parsers are released together
      # and only tested together — one PR, not four that each build alone.
      openapi-toolchain:
        patterns:
          - "*swift-openapi-*"
          - "*openapikit*"
          - "*swift-http-types*"
          - "*yams*"
      # Everything else the generator pulls in transitively.
      swift-support:
        patterns:
          - "*"
