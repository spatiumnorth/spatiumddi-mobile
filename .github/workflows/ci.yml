name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A docs-only change cannot break the build, and every job here is a macOS
    # runner. Safe while none of these checks is required: a required check on
    # a skipped workflow would sit pending forever.
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling. Main is the only place UI tests
  # run, so cancelling there would leave a merge with no UI result at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Xcode 27 by path, not whatever the image defaults to. The image also carries
# the next betas, and swift-format ships with Xcode — a floating default would
# let lint and build change under an unchanged commit. Bump both together, on
# purpose.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

jobs:
  format:
    name: swift-format
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: |
          xcrun swift-format lint --recursive --strict \
            SpatiumDDI/SpatiumDDI SpatiumDDI/SpatiumDDITests SpatiumDDI/SpatiumDDIUITests

  test:
    name: Build & test
    runs-on: xcode-27
    # Generous: a cold runner resolves the package graph and generates the
    # client before a single test runs. Short enough that a wedged job says so.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The runner's simulator line-up changes with the Xcode image, so pick a
      # device that actually exists rather than pinning a model name.
      - name: Choose a simulator
        id: sim
        run: |
          destination=$(./scripts/pick-simulator.py)
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      # Brings up the self-signed stub control plane, runs the suite against a
      # real TLS handshake, then tears it down. Without the stub the trust tests
      # skip, and the run would look green while the security-critical
      # assertions never executed.
      # Unit tests only on a pull request. UI tests drive a second app process
      # through the simulator and a hosted runner does not reliably have the
      # headroom: the runner app was killed before it could connect, failing a
      # run in which all 58 unit tests passed. They run on main instead, where a
      # retry costs nobody's review cycle.
      # The same booted, quieted device the UI job uses, and no parallel
      # testing, which would boot a fresh clone of it instead. Without this the
      # iOS 27 simulator's push daemon spins, starves the runner, and the trust
      # tests time out against a stub that can't get CPU. See boot-simulator.sh.
      - name: Boot the simulator
        run: ./scripts/boot-simulator.sh "$DESTINATION"
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}

      - name: Run tests against the stub control plane
        env:
          SPATIUM_TEST_DESTINATION: ${{ steps.sim.outputs.destination }}
          SPATIUM_TEST_EXTRA_ARGS: >-
            -only-testing:SpatiumDDITests
            -parallel-testing-enabled NO
            -resultBundlePath ${{ runner.temp }}/TestResults.xcresult
        run: ./scripts/dev-control-plane.sh test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  ui-test:
    name: UI tests
    # Only on main: slow, and the runner app's bootstrap is not dependable on a
    # hosted machine. Kept out of the pull-request path so a flake never blocks
    # a review.
    if: github.event_name == 'push'
    # Forty minutes of simulator is not worth spending on a commit whose unit
    # tests already failed.
    needs: test
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Choose a simulator
        id: sim
        run: |
          destination=$(./scripts/pick-simulator.py)
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      # Booted, settled and quieted before xcodebuild asks for it. The failures
      # this job has had were the simulator, not the app: "Failed to send
      # signal 19" and "failed to launch ...xctrunner", on a clone xcodebuild
      # booted on demand alongside the original. See boot-simulator.sh.
      - name: Boot the simulator
        run: ./scripts/boot-simulator.sh "$DESTINATION"
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}

      - name: Run UI tests against the stub control plane
        env:
          SPATIUM_TEST_DESTINATION: ${{ steps.sim.outputs.destination }}
          # One simulator, the booted one: parallel testing clones it, and a
          # second simulator is the headroom a hosted runner doesn't have. A
          # killed runner app is still worth one retry, relaunched clean.
          SPATIUM_TEST_EXTRA_ARGS: >-
            -only-testing:SpatiumDDIUITests
            -parallel-testing-enabled NO
            -retry-tests-on-failure
            -test-iterations 2
            -test-repetition-relaunch-enabled YES
            -resultBundlePath ${{ runner.temp }}/UITestResults.xcresult
        run: ./scripts/dev-control-plane.sh test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: ${{ runner.temp }}/UITestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
