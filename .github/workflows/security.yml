name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches newly disclosed advisories against unchanged code.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Superseded PR pushes are worth cancelling. A push to main and the weekly
  # schedule share a ref, so cancelling those would leave the default branch
  # with no completed scan for the commit that is actually deployed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Secrets, misconfiguration, and the pinned Swift packages in both
      # committed Package.resolved files.
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Secrets are the one class worth breaking the build over: a leaked token
      # in a public repo is compromised the moment it is pushed.
      - name: Fail on exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

  codeql:
    name: CodeQL
    # Deliberately not on Xcode 27 with the rest of CI. CodeQL's Swift
    # extractor supports Swift 5.4–6.3; Xcode 27 ships 6.4, which it cannot
    # trace. Pinned by image and by path so a default-Xcode bump on the image
    # can't move it onto an unsupported compiler. Move it when CodeQL lists 6.4.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # 60 minutes used to be enough and stopped being; 90 is headroom, not a
    # target. What the job actually spends its time on is below.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          queries: security-extended

      # This step does not currently finish inside the timeout, and the cause
      # is structural rather than a slow runner.
      #
      # The API client is produced by the swift-openapi-generator *build-tool
      # plugin*, so every build compiles the generator and its dependency tree
      # — OpenAPIKit, swift-collections, argument-parser, Yams, numerics — as
      # host tools before it reaches a line of app code, and CodeQL instruments
      # all of it. Measured on a timed-out run: 1,316 Swift compile units, of
      # which 24 were the app target and 14 were SpatiumAPI.
      #
      # `ONLY_ACTIVE_ARCH=YES` was tried here and **measured to do nothing** —
      # the arm64/x86_64 split stayed exactly 50/50, because SwiftPM package
      # targets do not honour it. It was removed rather than left in place
      # looking like a fix.
      #
      # The real lever is not building the generator at all. CLAUDE.md already
      # says to "pin one server version, generate against that exact document,
      # and commit the generated code"; doing that would take the generator out
      # of every build, not just this one. That is a deliberate change to how
      # the client is produced, so it is not made here.
      - name: Build
        run: |
          xcodebuild -project SpatiumDDI/SpatiumDDI.xcodeproj -scheme SpatiumDDI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
