# Generated API client configuration.
#
# openapi.json is the release asset from spatiumddi 2026.08.22-1, committed
# byte-for-byte so it can be verified against the published artefact:
#
#   gh release download 2026.08.22-1 --repo spatiumnorth/spatiumddi --pattern openapi.json
#   shasum -a 256 openapi.json
#   # 3d18647cb4c86bc76e01c60e5342dd4d5c88ff10513b7b4d2d9d90f5ec5e78d6
#
# Re-pin deliberately, against a release — never against a live control plane's
# /api/openapi.json, which tracks main and is not a contract anyone shipped.
generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
filter:
  # Phase 1 is read-mostly. The document describes 842 paths; generating all of
  # them produces an enormous client for a handful of screens. This is the
  # surface #884 Phase 1 names, plus the two Phase 2 writes an operator
  # standing in front of a machine actually needs — allocating an address and
  # naming it (spatiumddi-mobile#7). Both POSTs are on paths already listed
  # here for their GET, so the filter shape is unchanged.
  paths:
    # Platform state — version handshake and the health/maintenance banner.
    - /api/v1/version
    - /health/platform
    # Reading and writing the maintenance window (spatiumddi-mobile#11). There
    # is no dedicated maintenance endpoint — the flag lives in the settings
    # document, and `SettingsUpdate` is all-optional, so sending the two
    # maintenance fields leaves the other 127 alone. The banner keeps reading
    # /health/platform, which needs neither auth nor this grant.
    - /api/v1/settings

    # Identity and client-side permission gating (UX only — see #4).
    - /api/v1/auth/me
    - /api/v1/auth/me/permissions

    # Rollups. Only three exist server-side; the DDI figures the overview shows
    # are counted from the resource endpoints below, not from a dashboard call.
    - /api/v1/dashboards/network/summary
    - /api/v1/dashboards/security/summary

    # Global search.
    - /api/v1/search
    - /api/v1/search/types

    # Alerts. Resolving is a separate path from the collection — filtering a
    # collection never brings its sub-paths with it.
    - /api/v1/alerts/events
    - /api/v1/alerts/events/{event_id}/resolve

    # IPAM: space → block → subnet → address.
    - /api/v1/ipam/spaces
    - /api/v1/ipam/spaces/{space_id}
    - /api/v1/ipam/blocks
    - /api/v1/ipam/blocks/{block_id}
    - /api/v1/ipam/subnets
    - /api/v1/ipam/subnets/{subnet_id}
    - /api/v1/ipam/subnets/{subnet_id}/addresses
    - /api/v1/ipam/addresses/{address_id}
    # Read-only peek at what `allocate_next_ip` would hand out. Explicitly no
    # lock and no write: two callers get the same candidate and the first to
    # POST wins, so the allocate sheet says so and handles losing the race.
    - /api/v1/ipam/subnets/{subnet_id}/next-ip-preview
    - /api/v1/reports/top-subnets-by-utilization
    # Is this subnet filling up, or was it always like this — the triage
    # question a single utilisation number cannot answer (#15).
    - /api/v1/ipam/subnets/{subnet_id}/utilization-history

    # Traffic over time, and the Top-N cards the web console leads with (#15).
    # Both time-series take a window and an optional server; the reports take
    # nothing and are gated on the `reports.top_n` module.
    - /api/v1/metrics/dns/timeseries
    - /api/v1/metrics/dhcp/timeseries
    - /api/v1/reports/top-dns-clients
    - /api/v1/reports/top-modified-resources
    - /api/v1/reports/top-owners-by-ip-count

    # DNS: group → zone → record.
    - /api/v1/dns/groups
    - /api/v1/dns/groups/{group_id}
    - /api/v1/dns/groups/{group_id}/servers
    - /api/v1/dns/groups/{group_id}/zones
    - /api/v1/dns/groups/{group_id}/zones/{zone_id}
    - /api/v1/dns/groups/{group_id}/zones/{zone_id}/records
    # One record, for correcting or removing it (spatiumddi-mobile#8). Note
    # this is a separate path from the collection above — filtering the
    # collection does not bring the item with it.
    - /api/v1/dns/groups/{group_id}/zones/{zone_id}/records/{record_id}

    # DHCP: server + group → scope → pool / reservation / lease.
    - /api/v1/dhcp/servers
    - /api/v1/dhcp/servers/{server_id}
    - /api/v1/dhcp/servers/{server_id}/leases
    - /api/v1/dhcp/servers/{server_id}/stats
    - /api/v1/dhcp/server-groups
    - /api/v1/dhcp/server-groups/{group_id}/scopes
    - /api/v1/dhcp/scopes/{scope_id}
    - /api/v1/dhcp/scopes/{scope_id}/pools
    - /api/v1/dhcp/scopes/{scope_id}/statics
    # The rack-side write: this MAC gets this IP, with the MAC on a label in
    # front of you (spatiumddi-mobile#18). POST is on the collection above;
    # the item path carries the delete.
    - /api/v1/dhcp/statics/{static_id}
    # Deleting a lease, from the row that shows it.
    - /api/v1/dhcp/servers/{server_id}/leases/{lease_id}
    # Blocking a MAC at DHCP. An availability decision about a device you may
    # be misreading, so it is typed-gated in the app like a delete is.
    - /api/v1/dhcp/server-groups/{group_id}/mac-blocks
    - /api/v1/dhcp/mac-blocks/{block_id}

    # ── Operator-relevant surfaces beyond Phase 1's core ──────────────────
    # Read-only, and chosen against one test: does an operator away from a desk
    # ever need this? Packet capture, nmap, the subnet planner, backup and the
    # AI configuration are all deliberately absent — a phone is a bad place to
    # run any of them.

    # Approvals and requests. Deciding one is the best mobile write there is:
    # the approver is the person most often away from a desk.
    - /api/v1/change-requests
    - /api/v1/change-requests/{cr_id}
    - /api/v1/change-requests/{cr_id}/approve
    - /api/v1/change-requests/{cr_id}/reject
    - /api/v1/change-requests/{cr_id}/cancel
    - /api/v1/requests

    # Expiry tracking: the two things that page someone at an awkward hour.
    - /api/v1/domains
    - /api/v1/domains/{domain_id}
    - /api/v1/tls-certs
    - /api/v1/tls-certs/{target_id}

    # Network modelling.
    - /api/v1/vrfs
    - /api/v1/vrfs/{vrf_id}
    - /api/v1/vlans/routers
    - /api/v1/vlans/routers/{router_id}/vlans
    - /api/v1/circuits
    - /api/v1/circuits/{circuit_id}
    - /api/v1/asns
    - /api/v1/asns/{asn_id}

    # Ownership entities, which cross-cut everything above.
    - /api/v1/customers
    - /api/v1/sites
    - /api/v1/providers

    # ── The read-only remainder, ranked by mobile fit (#17) ───────────────
    # Four of that issue's five strong-fit surfaces. Platform Insights is the
    # fifth and is **not here**: the 2026.08.22-1 document has no endpoint for
    # it, so it stays unbuilt rather than guessed at.

    # What rotted, and one bulk action to mark it. The report is `object` in
    # the document — untyped — so the app decodes the rows it needs by hand
    # from the container rather than pretending to a schema the server did
    # not publish.
    - /api/v1/ipam/reports/stale-ips
    - /api/v1/ipam/reports/stale-ips/deprecate

    # "What does this translate to", answered from an address rather than
    # browsed as a table — so the by-ip lookup only. The collection is
    # deliberately absent: a NAT table is a desk-sized thing to read, and
    # generating a path nothing calls is dead weight in a client this size.
    - /api/v1/ipam/nat-mappings/by-ip/{ip_address_id}

    # Looking Glass: route-for-this-IP and route-for-this-prefix as an action
    # from an address or subnet, plus peer health. Full route-table browsing
    # stays desktop — `/routes` is deliberately not listed.
    - /api/v1/looking-glass/routes/for-ip
    - /api/v1/looking-glass/routes/by-prefix
    - /api/v1/looking-glass/peers
    - /api/v1/looking-glass/dashboard-summary

    # Did the UniFi sync break — a from-the-couch question. The tiles, not the
    # configuration forms behind them.
    - /api/v1/dashboards/integrations/summary

    # Security signal. Acknowledging is in; blocking a MAC is deliberately
    # not — it changes what that device gets from DHCP, and a mis-tap on a
    # train has a blast radius this app should not hand out one-handed.
    - /api/v1/new-devices/sightings
    - /api/v1/new-devices/sightings/{sighting_id}/acknowledge
    - /api/v1/new-devices/summary

    # Administration: who is in, what they hold, and what has been done.
    - /api/v1/users
    - /api/v1/sessions
    - /api/v1/api-tokens
    # Revoking a lost device's credential from whatever device is still in
    # hand (spatiumddi-mobile#13). Item paths, not the collections above —
    # filtering a collection never brings its sub-paths with it.
    - /api/v1/sessions/{session_id}
    - /api/v1/api-tokens/{token_id}
    - /api/v1/audit
    - /api/v1/admin/trash

    # Which optional modules this control plane has switched on. The rule
    # against feature-probing needs somewhere to ask instead, and this is it.
    - /api/v1/admin/feature-modules

    # ── Troubleshooting a specific client ─────────────────────────────────
    # lease-history filters by mac / ip / hostname, which is the whole point:
    # a technician stood next to a machine that will not get an address needs
    # to know whether it ever asked, what it got, and when that lapsed.
    - /api/v1/dhcp/servers/{server_id}/lease-history
    - /api/v1/dhcp/servers/{server_id}/recent-events
    - /api/v1/dns/servers/{server_id}/recent-events
    - /api/v1/logs/sources

    # ── Where is this MAC ─────────────────────────────────────────────────
    # The `network.device` module polls switches over SNMP, so the platform
    # already knows which port learned a MAC (spatiumddi-mobile#16). Read-only
    # plus `poll-now`, which refreshes what was learned and mutates nothing —
    # "poll it again while I watch the port LED" is the on-site loop.
    #
    # Device CRUD, SNMP credentials and CSV import are deliberately absent:
    # configuring the poller is desk work, consuming what it learned is not.
    - /api/v1/network-devices
    - /api/v1/network-devices/{device_id}
    - /api/v1/network-devices/{device_id}/interfaces
    - /api/v1/network-devices/{device_id}/arp
    - /api/v1/network-devices/{device_id}/fdb
    - /api/v1/network-devices/{device_id}/neighbours
    - /api/v1/network-devices/{device_id}/poll-now

    # ── Diagnostics, run from the control plane ───────────────────────────
    # The whole point is the vantage point: these answer "can the *server*
    # reach it / resolve it", which is the question an operator standing in a
    # rack cannot answer from the device in their hand. POST because the
    # parameters are a body; only Wake-on-LAN changes anything, and what it
    # changes is a power state.
    #
    # `target` on these requests selects which appliance runs the tool. The app
    # always omits it, which means the control plane itself — adding a picker
    # is worth doing only once a phone user has an appliance fleet to pick from.
    - /api/v1/tools/ping
    - /api/v1/tools/traceroute
    - /api/v1/tools/mtr
    - /api/v1/tools/dig
    - /api/v1/tools/whois
    - /api/v1/tools/port-test
    - /api/v1/tools/tls-cert
    - /api/v1/tools/mac-vendor
    - /api/v1/tools/dns-propagation
    - /api/v1/tools/wol
    # Nmap. Started here, then polled — the server runs it, so the phone is
    # only the thing that asked. `stream` (SSE) is deliberately not generated:
    # a scan that takes a minute does not need a live feed on a phone, and
    # polling survives the app being backgrounded, which a stream does not.
    - /api/v1/nmap/scans
    - /api/v1/nmap/scans/{scan_id}
    - /api/v1/nmap/scans/{scan_id}/stamp-discovered

    # Deliberately absent: /tools/firewall-logs (a desk-sized log search) and
    # /pcap/* (a phone is a bad place to read a packet capture).

    # The DHCP and DNS protocol logs — the conversation itself, filterable by
    # MAC or client IP. These are POST because the filter is a body, not
    # because they change anything: they read a log and return rows. The
    # read-only rule this app holds to is about not mutating a production
    # network, not about HTTP verbs, and these are the two most useful
    # troubleshooting surfaces the platform has.
    #
    # `recent-events` is NOT this — that returns audit rows about the server,
    # not packets from clients.
    - /api/v1/logs/dhcp-activity
    - /api/v1/logs/dns-queries
